name: AESTHETIC Bot
on:
  schedule:
    # 10:30, 14:30, 18:30, 21:30 по Екатеринбургу (UTC+5) = 05:30, 09:30, 13:30, 16:30 UTC.
    # ВАЖНО: GitHub отключает scheduled-воркфлоу после 60 дней без коммитов
    # в публичном репозитории ("disabled_inactivity"). Делайте коммиты чаще.
    - cron: '30 5,9,13,16 * * *'
  workflow_dispatch:

concurrency:
  group: aesthetic-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Restore posted articles DB
        uses: actions/cache/restore@v6
        with:
          path: bot_beauty.db
          key: aesthetic-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aesthetic-db-

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run beauty collector
        env:
          BOT_TOKEN: ${{ secrets.AESTHETIC_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.AESTHETIC_CHANNEL_ID }}
          THEME: beauty
          BRAND_NAME: AESTHETIC.RU
          DATABASE_PATH: bot_beauty.db
          VIDEO_ORIENTATION: vertical
          MUSIC_STYLE: auto
          USE_THEMED_IMAGES: "true"
          IMAGE_ORIENTATION: portrait
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python main.py --once --strict

      - name: Build Dzen RSS feed
        if: always()
        env:
          DZEN_ENABLED: ${{ vars.DZEN_ENABLED }}
        run: |
          if [ "$DZEN_ENABLED" = "true" ]; then
            python dzen_feed.py flush
          else
            echo "DZEN_ENABLED is not true, skipping the feed"
          fi

      - name: Commit Dzen feed
        if: always()
        run: |
          git config user.name "ainovostiru-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "feed unchanged"
            exit 0
          fi
          git commit -m "dzen: update RSS feed"
          for attempt in 1 2 3; do
            if git push; then
              echo "feed pushed"
              exit 0
            fi
            echo "push attempt $attempt failed, rebasing onto main"
            git pull --rebase origin main
          done
          echo "could not push the feed after 3 attempts"
          exit 0

      - name: Save posted articles DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: bot_beauty.db
          key: aesthetic-db-${{ github.run_id }}-${{ github.run_attempt }}
