name: FACTUM Bot
on:
  schedule:
    # 09:30, 13:30, 17:30, 21:30 по Екатеринбургу (UTC+5) = 04:30, 08:30, 12:30, 16:30 UTC.
    # ВАЖНО: GitHub отключает scheduled-воркфлоу после 60 дней без коммитов
    # в публичном репозитории ("disabled_inactivity"). Делайте коммиты чаще.
    - cron: '30 4,8,12,16 * * *'
  workflow_dispatch:

concurrency:
  group: factum-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DZEN_ENABLED: ${{ vars.DZEN_ENABLED }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore posted articles DB
        uses: actions/cache/restore@v6
        with:
          path: bot_facts.db
          key: factum-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            factum-db-

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run facts collector
        env:
          BOT_TOKEN: ${{ secrets.FACTUM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.FACTUM_CHANNEL_ID }}
          THEME: facts
          BRAND_NAME: FACTUM.RU
          DATABASE_PATH: bot_facts.db
        run: python main.py --once --strict

      - name: Build Dzen RSS feed
        if: always()
        run: |
          if [ "$DZEN_ENABLED" = "true" ]; then
            python dzen_feed.py flush
          else
            echo "DZEN_ENABLED is not true, skipping the feed"
          fi

      - name: Commit Dzen feed
        if: always()
        run: |
          set +e
          git config user.name "ainovostiru-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "feed unchanged"
            exit 0
          fi
          git commit -m "dzen: update RSS feed" >/dev/null
          for attempt in 1 2 3 4; do
            if git push; then
              echo "feed pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected, rebasing onto main"
            git rebase --abort >/dev/null 2>&1
            git fetch origin >/dev/null 2>&1
            if ! git rebase origin/main >/dev/null 2>&1; then
              echo "rebase conflicted, rebuilding the feed on top of the remote state"
              git rebase --abort >/dev/null 2>&1
              git reset --hard origin/main >/dev/null 2>&1
              python dzen_feed.py flush
              git add -A docs
              if git diff --staged --quiet; then
                echo "nothing left to commit"
                exit 0
              fi
              git commit -m "dzen: update RSS feed" >/dev/null
            fi
          done
          echo "could not push the feed, the next run will rebuild it"
          exit 0
      - name: Save posted articles DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: bot_facts.db
          key: factum-db-${{ github.run_id }}-${{ github.run_attempt }}
