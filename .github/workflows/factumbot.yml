name: FACTUM Bot
on:
  schedule:
    # 09:30, 13:30, 17:30, 21:30 по Екатеринбургу (UTC+5) = 04:30, 08:30, 12:30, 16:30 UTC.
    # ВАЖНО: GitHub отключает scheduled-воркфлоу после 60 дней без коммитов
    # в публичном репозитории ("disabled_inactivity"). Делайте коммиты чаще.
    - cron: '30 4,8,12,16 * * *'
  workflow_dispatch:

concurrency:
  group: factum-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Restore posted articles DB
        uses: actions/cache/restore@v6
        with:
          path: bot_facts.db
          key: factum-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            factum-db-

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run facts collector
        env:
          BOT_TOKEN: ${{ secrets.FACTUM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.FACTUM_CHANNEL_ID }}
          THEME: facts
          BRAND_NAME: FACTUM.RU
          DATABASE_PATH: bot_facts.db
        run: python main.py --once --strict

      - name: Build Dzen RSS feed
        if: always()
        env:
          DZEN_ENABLED: ${{ vars.DZEN_ENABLED }}
        run: |
          if [ "$DZEN_ENABLED" = "true" ]; then
            python dzen_feed.py flush
          else
            echo "DZEN_ENABLED is not true, skipping the feed"
          fi

      - name: Commit Dzen feed
        if: always()
        run: |
          git config user.name "ainovostiru-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs .dzen_pending.json
          if git diff --staged --quiet; then
            echo "feed unchanged"
          else
            git commit -m "dzen: update RSS feed"
            git push
          fi

      - name: Save posted articles DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: bot_facts.db
          key: factum-db-${{ github.run_id }}-${{ github.run_attempt }}
