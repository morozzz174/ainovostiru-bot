name: AI News Bot
on:
  schedule:
    # 10:00, 13:00, 16:00, 19:00 по Екатеринбургу (UTC+5) = 05:00, 08:00, 11:00, 14:00 UTC.
    # ВАЖНО: GitHub отключает scheduled-воркфлоу после 60 дней без коммитов
    # в публичном репозитории ("disabled_inactivity"). Делайте коммиты чаще.
    - cron: '0 5,8,11,14 * * *'
  workflow_dispatch:

concurrency:
  group: ai-news-bot
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DZEN_ENABLED: ${{ vars.DZEN_ENABLED }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore posted articles DB
        uses: actions/cache/restore@v6
        with:
          path: |
            ainovosti.db
            instagram_session.pkl
          key: ainovosti-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ainovosti-db-

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news collector
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          THEME: ai
          BRAND_NAME: AINOVOSTI.RU
          DATABASE_PATH: ainovosti.db
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          TT_ENABLED: ${{ secrets.TT_ENABLED }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_OPEN_ID: ${{ secrets.TT_OPEN_ID }}
          TT_PRIVACY_LEVEL: ${{ secrets.TT_PRIVACY_LEVEL }}
        run: python main.py --once --strict

      - name: Build Dzen RSS feed
        if: always()
        run: |
          if [ "$DZEN_ENABLED" = "true" ]; then
            python dzen_feed.py flush
          else
            echo "DZEN_ENABLED is not true, skipping the feed"
          fi

      - name: Commit Dzen feed
        if: always()
        run: |
          set +e
          git config user.name "ainovostiru-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "feed unchanged"
            exit 0
          fi
          git commit -m "dzen: update RSS feed" >/dev/null
          for attempt in 1 2 3 4; do
            if git push; then
              echo "feed pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt rejected, rebasing onto main"
            git rebase --abort >/dev/null 2>&1
            git fetch origin >/dev/null 2>&1
            if ! git rebase origin/main >/dev/null 2>&1; then
              echo "rebase conflicted, rebuilding the feed on top of the remote state"
              git rebase --abort >/dev/null 2>&1
              git reset --hard origin/main >/dev/null 2>&1
              python dzen_feed.py flush
              git add -A docs
              if git diff --staged --quiet; then
                echo "nothing left to commit"
                exit 0
              fi
              git commit -m "dzen: update RSS feed" >/dev/null
            fi
          done
          echo "could not push the feed, the next run will rebuild it"
          exit 0
      - name: Save posted articles DB
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ainovosti.db
            instagram_session.pkl
          key: ainovosti-db-${{ github.run_id }}-${{ github.run_attempt }}
